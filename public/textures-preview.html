<!DOCTYPE html>
<html lang="en">
<head>

  <title>Preview Texturas</title>

    img { width: 200px; height: 200px; object-fit: cover; border-radius: 4px; }
  </style>
</head>

  <div class="grid">

      <img src="/textures/nogal.jpg" alt="1" />
      <p><b>Imagen 1</b> (Actualmente: Nogal)</p>
    </div>
    <div class="card">
      <img src="/textures/roble.jpg" alt="2" />
      <p><b>Imagen 2</b> (Actualmente: Roble)</p>
    </div>
    <div class="card">
      <img src="/textures/chocolate.jpg" alt="3" />
      <p><b>Imagen 3</b> (Actualmente: Chocolate)</p>
    </div>
    <div class="card">
      <img src="/textures/encino.jpg" alt="4" />
      <p><b>Imagen 4</b> (Actualmente: Encino)</p>
    </div>
  </div>
</body>
</html>
